spring.application.name=roommate-connect
server.port=8080

# Loads application-local.properties (gitignored, holds your secrets)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Database (the password lives in application-local.properties) ---
spring.datasource.url=jdbc:mysql://localhost:3306/roommate_connect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=roommate_user
spring.datasource.hikari.connection-timeout=5000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CORS: origins allowed to call this API (used in Stage 4) ---
app.cors.allowed-origins=http://localhost:5173

# --- JWT ---
app.jwt.access-token-minutes=30

# --- Refresh token, email verification ---
app.jwt.refresh-token-days=7
app.verification.expiry-hours=24
app.frontend-url=http://localhost:5173